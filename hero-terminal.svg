<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Harsh Pardhi terminal card">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1C6EB4" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="430" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- background + grid -->
    <rect width="900" height="430" fill="#0B1220"/>
    <rect width="900" height="430" fill="url(#grid)"/>

    <!-- static confetti dots -->
    <g opacity="0.55">
      <circle cx="60"  cy="60"  r="3" fill="#1C6EB4"/>
      <circle cx="840" cy="90"  r="3" fill="#2EA043"/>
      <circle cx="800" cy="380" r="3" fill="#FFBD2E"/>
      <circle cx="90"  cy="370" r="3" fill="#58A6FF"/>
      <circle cx="450" cy="30"  r="2.5" fill="#58A6FF"/>
      <circle cx="250" cy="410" r="2.5" fill="#1C6EB4"/>
      <circle cx="650" cy="25"  r="2.5" fill="#2EA043"/>
    </g>

    <!-- animated falling confetti -->
    <g>
      <rect x="140" y="-20" width="6" height="11" rx="1.5" fill="#1C6EB4" opacity="0.8" transform="rotate(18 143 -14)"><animate attributeName="y" from="-20" to="450" dur="9s"  repeatCount="indefinite"/></rect>
      <rect x="300" y="-20" width="5" height="9"  rx="1.5" fill="#2EA043" opacity="0.7" transform="rotate(-14 302 -15)"><animate attributeName="y" from="-20" to="450" dur="12s" begin="-4s" repeatCount="indefinite"/></rect>
      <rect x="520" y="-20" width="6" height="10" rx="1.5" fill="#FFBD2E" opacity="0.7" transform="rotate(24 523 -15)"><animate attributeName="y" from="-20" to="450" dur="10s" begin="-7s" repeatCount="indefinite"/></rect>
      <rect x="700" y="-20" width="5" height="9"  rx="1.5" fill="#58A6FF" opacity="0.8" transform="rotate(-20 702 -15)"><animate attributeName="y" from="-20" to="450" dur="11s" begin="-2s" repeatCount="indefinite"/></rect>
      <rect x="820" y="-20" width="6" height="11" rx="1.5" fill="#1C6EB4" opacity="0.6" transform="rotate(12 823 -14)"><animate attributeName="y" from="-20" to="450" dur="13s" begin="-9s" repeatCount="indefinite"/></rect>
      <rect x="60"  y="-20" width="5" height="9"  rx="1.5" fill="#FFBD2E" opacity="0.6" transform="rotate(-24 62 -15)"><animate attributeName="y" from="-20" to="450" dur="12s" begin="-6s" repeatCount="indefinite"/></rect>
      <rect x="420" y="-20" width="5" height="9"  rx="1.5" fill="#58A6FF" opacity="0.6" transform="rotate(30 422 -15)"><animate attributeName="y" from="-20" to="450" dur="9.5s" begin="-3s" repeatCount="indefinite"/></rect>
      <rect x="620" y="-20" width="6" height="10" rx="1.5" fill="#2EA043" opacity="0.6" transform="rotate(-10 623 -15)"><animate attributeName="y" from="-20" to="450" dur="10.5s" begin="-8s" repeatCount="indefinite"/></rect>
    </g>

    <!-- macOS-style terminal window -->
    <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
      <rect x="90" y="60" width="720" height="310" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <path d="M90 72 a12 12 0 0 1 12-12 h696 a12 12 0 0 1 12 12 v26 h-720 z" fill="#1F242C"/>
      <circle cx="114" cy="79" r="6.5" fill="#FF5F56"/>
      <circle cx="136" cy="79" r="6.5" fill="#FFBD2E"/>
      <circle cx="158" cy="79" r="6.5" fill="#27C93F"/>
      <text x="450" y="84" fill="#8B949E" font-size="13" text-anchor="middle">harsh@hexaware: ~/cloud-platform — zsh</text>

      <text x="118" y="132" font-size="15"><tspan fill="#27C93F">$</tspan><tspan fill="#E6EDF3"> whoami</tspan></text>
      <text x="118" y="160" fill="#8B949E" font-size="15">harsh_pardhi · Cloud Platform Engineer</text>

      <text x="118" y="196" font-size="15"><tspan fill="#27C93F">$</tspan><tspan fill="#E6EDF3"> stack --top</tspan></text>
      <text x="118" y="224" fill="#58A6FF" font-size="15">Azure · Terraform · Kubernetes · CI/CD · GenAIOps</text>

      <text x="118" y="260" font-size="15"><tspan fill="#27C93F">$</tspan><tspan fill="#E6EDF3"> impact --last-2y</tspan></text>
      <text x="118" y="288" fill="#8B949E" font-size="15">5,000+ users @ 99% accuracy · 20+ hrs/mo automated · MTTR -25%</text>

      <text x="118" y="324" font-size="15"><tspan fill="#27C93F">$</tspan><tspan fill="#E6EDF3"> status</tspan></text>
      <text x="118" y="350" font-size="15"><tspan fill="#27C93F">●</tspan><tspan fill="#E6EDF3"> open to opportunities</tspan></text>
      <rect x="330" y="338" width="9" height="16" fill="#58A6FF"><animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
