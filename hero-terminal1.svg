<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Harsh Pardhi terminal card">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1C6EB4" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1F3864" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- transparent background + light grid across the whole canvas -->
  <rect width="900" height="430" fill="none"/>
  <rect width="900" height="430" fill="url(#grid)"/>

  <!-- static confetti spread across the whole canvas -->
  <g opacity="0.75">
    <circle cx="40"  cy="50"  r="3"   fill="#1C6EB4"/>
    <circle cx="120" cy="400" r="3"   fill="#2EA043"/>
    <circle cx="210" cy="30"  r="2.5" fill="#FFBD2E"/>
    <circle cx="330" cy="415" r="2.5" fill="#58A6FF"/>
    <circle cx="450" cy="22"  r="3"   fill="#2EA043"/>
    <circle cx="560" cy="410" r="2.5" fill="#1C6EB4"/>
    <circle cx="680" cy="30"  r="3"   fill="#58A6FF"/>
    <circle cx="790" cy="405" r="2.5" fill="#FFBD2E"/>
    <circle cx="865" cy="60"  r="3"   fill="#2EA043"/>
    <circle cx="70"  cy="215" r="2.5" fill="#FFBD2E"/>
    <circle cx="855" cy="230" r="2.5" fill="#1C6EB4"/>
    <rect x="160" y="90"  width="6" height="10" rx="1.5" fill="#58A6FF" transform="rotate(24 163 95)"/>
    <rect x="760" y="120" width="6" height="10" rx="1.5" fill="#2EA043" transform="rotate(-18 763 125)"/>
    <rect x="90"  y="330" width="6" height="10" rx="1.5" fill="#1C6EB4" transform="rotate(-24 93 335)"/>
    <rect x="820" y="320" width="6" height="10" rx="1.5" fill="#FFBD2E" transform="rotate(18 823 325)"/>
    <rect x="250" y="20"  width="5" height="9"  rx="1.5" fill="#1F3864" transform="rotate(30 252 24)"/>
    <rect x="640" y="405" width="5" height="9"  rx="1.5" fill="#1F3864" transform="rotate(-30 642 409)"/>
  </g>

  <!-- animated falling confetti across the whole canvas -->
  <g>
    <rect x="30"  y="-20" width="6" height="11" rx="1.5" fill="#1C6EB4" opacity="0.8" transform="rotate(18 33 -14)"><animate attributeName="y" from="-20" to="450" dur="9s"   repeatCount="indefinite"/></rect>
    <rect x="110" y="-20" width="5" height="9"  rx="1.5" fill="#2EA043" opacity="0.7" transform="rotate(-14 112 -15)"><animate attributeName="y" from="-20" to="450" dur="12s" begin="-4s" repeatCount="indefinite"/></rect>
    <rect x="200" y="-20" width="6" height="10" rx="1.5" fill="#FFBD2E" opacity="0.7" transform="rotate(24 203 -15)"><animate attributeName="y" from="-20" to="450" dur="10s" begin="-7s" repeatCount="indefinite"/></rect>
    <rect x="290" y="-20" width="5" height="9"  rx="1.5" fill="#58A6FF" opacity="0.8" transform="rotate(-20 292 -15)"><animate attributeName="y" from="-20" to="450" dur="11s" begin="-2s" repeatCount="indefinite"/></rect>
    <rect x="380" y="-20" width="6" height="11" rx="1.5" fill="#1F3864" opacity="0.6" transform="rotate(12 383 -14)"><animate attributeName="y" from="-20" to="450" dur="13s" begin="-9s" repeatCount="indefinite"/></rect>
    <rect x="470" y="-20" width="5" height="9"  rx="1.5" fill="#FFBD2E" opacity="0.6" transform="rotate(-24 472 -15)"><animate attributeName="y" from="-20" to="450" dur="12s" begin="-6s" repeatCount="indefinite"/></rect>
    <rect x="560" y="-20" width="5" height="9"  rx="1.5" fill="#58A6FF" opacity="0.6" transform="rotate(30 562 -15)"><animate attributeName="y" from="-20" to="450" dur="9.5s" begin="-3s" repeatCount="indefinite"/></rect>
    <rect x="650" y="-20" width="6" height="10" rx="1.5" fill="#2EA043" opacity="0.6" transform="rotate(-10 653 -15)"><animate attributeName="y" from="-20" to="450" dur="10.5s" begin="-8s" repeatCount="indefinite"/></rect>
    <rect x="740" y="-20" width="6" height="11" rx="1.5" fill="#1C6EB4" opacity="0.7" transform="rotate(20 743 -14)"><animate attributeName="y" from="-20" to="450" dur="11.5s" begin="-5s" repeatCount="indefinite"/></rect>
    <rect x="830" y="-20" width="5" height="9"  rx="1.5" fill="#FFBD2E" opacity="0.7" transform="rotate(-16 832 -15)"><animate attributeName="y" from="-20" to="450" dur="9.8s" begin="-1s" repeatCount="indefinite"/></rect>
    <rect x="875" y="-20" width="5" height="9"  rx="1.5" fill="#2EA043" opacity="0.6" transform="rotate(26 877 -15)"><animate attributeName="y" from="-20" to="450" dur="12.5s" begin="-10s" repeatCount="indefinite"/></rect>
    <rect x="15"  y="-20" width="5" height="9"  rx="1.5" fill="#58A6FF" opacity="0.6" transform="rotate(-28 17 -15)"><animate attributeName="y" from="-20" to="450" dur="13.5s" begin="-7.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Apple-style WHITE terminal window -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" filter="url(#soft)">
    <rect x="110" y="60" width="680" height="310" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
    <path d="M110 72 a12 12 0 0 1 12-12 h656 a12 12 0 0 1 12 12 v26 h-680 z" fill="#F6F8FA"/>
    <line x1="110" y1="98" x2="790" y2="98" stroke="#D0D7DE" stroke-width="1"/>
    <circle cx="134" cy="79" r="6.5" fill="#FF5F56"/>
    <circle cx="156" cy="79" r="6.5" fill="#FFBD2E"/>
    <circle cx="178" cy="79" r="6.5" fill="#27C93F"/>
    <text x="450" y="84" fill="#57606A" font-size="13" text-anchor="middle">harsh pardhi: ~/cloud-devops — zsh</text>

    <text x="138" y="134" font-size="15"><tspan fill="#1A7F37">$</tspan><tspan fill="#1F2328"> whoami</tspan></text>
    <text x="138" y="162" fill="#57606A" font-size="15">harsh_pardhi · Cloud & DevOps Engineer</text>

    <text x="138" y="198" font-size="15"><tspan fill="#1A7F37">$</tspan><tspan fill="#1F2328"> stack --top</tspan></text>
    <text x="138" y="226" fill="#1C6EB4" font-size="15">Azure · Terraform · Kubernetes · CI/CD · GenAIOps</text>

    <text x="138" y="262" font-size="15"><tspan fill="#1A7F37">$</tspan><tspan fill="#1F2328"> impact --last-2y</tspan></text>
    <text x="138" y="290" fill="#57606A" font-size="15">5,000+ users @ 99% accuracy · 20+ hrs/mo automated · MTTR -25%</text>

    <text x="138" y="326" font-size="15"><tspan fill="#1A7F37">$</tspan><tspan fill="#1F2328"> status</tspan></text>
    <text x="138" y="352" font-size="15"><tspan fill="#1A7F37">●</tspan><tspan fill="#1F2328"> open to opportunities</tspan></text>
    <rect x="352" y="340" width="9" height="16" fill="#1C6EB4"><animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></rect>
  </g>
</svg>
