<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Harsh Pardhi — Azure Cloud and Automation Engineer terminal card">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1B3A6B" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#111C2E" flood-opacity="0.20"/>
    </filter>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#2A5490"/>
    </linearGradient>
  </defs>

  <rect width="900" height="430" fill="none"/>
  <rect width="900" height="430" fill="url(#grid)"/>

  <!-- static particles -->
  <g opacity="0.7">
    <circle cx="40"  cy="50"  r="3"   fill="#1B3A6B"/>
    <circle cx="120" cy="400" r="3"   fill="#2A5490"/>
    <circle cx="210" cy="30"  r="2.5" fill="#4A7BC8"/>
    <circle cx="330" cy="415" r="2.5" fill="#1B3A6B"/>
    <circle cx="450" cy="22"  r="3"   fill="#2A5490"/>
    <circle cx="560" cy="410" r="2.5" fill="#4A7BC8"/>
    <circle cx="680" cy="30"  r="3"   fill="#1B3A6B"/>
    <circle cx="790" cy="405" r="2.5" fill="#2A5490"/>
    <circle cx="865" cy="60"  r="3"   fill="#4A7BC8"/>
    <circle cx="70"  cy="215" r="2.5" fill="#2A5490"/>
    <circle cx="855" cy="230" r="2.5" fill="#1B3A6B"/>
    <rect x="160" y="90"  width="6" height="10" rx="1.5" fill="#4A7BC8" transform="rotate(24 163 95)"/>
    <rect x="760" y="120" width="6" height="10" rx="1.5" fill="#2A5490" transform="rotate(-18 763 125)"/>
    <rect x="90"  y="330" width="6" height="10" rx="1.5" fill="#1B3A6B" transform="rotate(-24 93 335)"/>
    <rect x="820" y="320" width="6" height="10" rx="1.5" fill="#4A7BC8" transform="rotate(18 823 325)"/>
    <rect x="250" y="20"  width="5" height="9"  rx="1.5" fill="#111C2E" transform="rotate(30 252 24)"/>
    <rect x="640" y="405" width="5" height="9"  rx="1.5" fill="#111C2E" transform="rotate(-30 642 409)"/>
  </g>

  <!-- drifting particles -->
  <g>
    <rect x="30"  y="-20" width="6" height="11" rx="1.5" fill="#1B3A6B" opacity="0.7" transform="rotate(18 33 -14)"><animate attributeName="y" from="-20" to="450" dur="9s"    repeatCount="indefinite"/></rect>
    <rect x="110" y="-20" width="5" height="9"  rx="1.5" fill="#2A5490" opacity="0.6" transform="rotate(-14 112 -15)"><animate attributeName="y" from="-20" to="450" dur="12s"   begin="-4s"   repeatCount="indefinite"/></rect>
    <rect x="200" y="-20" width="6" height="10" rx="1.5" fill="#4A7BC8" opacity="0.6" transform="rotate(24 203 -15)"><animate attributeName="y" from="-20" to="450" dur="10s"   begin="-7s"   repeatCount="indefinite"/></rect>
    <rect x="290" y="-20" width="5" height="9"  rx="1.5" fill="#1B3A6B" opacity="0.7" transform="rotate(-20 292 -15)"><animate attributeName="y" from="-20" to="450" dur="11s"   begin="-2s"   repeatCount="indefinite"/></rect>
    <rect x="380" y="-20" width="6" height="11" rx="1.5" fill="#111C2E" opacity="0.5" transform="rotate(12 383 -14)"><animate attributeName="y" from="-20" to="450" dur="13s"   begin="-9s"   repeatCount="indefinite"/></rect>
    <rect x="470" y="-20" width="5" height="9"  rx="1.5" fill="#4A7BC8" opacity="0.5" transform="rotate(-24 472 -15)"><animate attributeName="y" from="-20" to="450" dur="12s"   begin="-6s"   repeatCount="indefinite"/></rect>
    <rect x="560" y="-20" width="5" height="9"  rx="1.5" fill="#2A5490" opacity="0.5" transform="rotate(30 562 -15)"><animate attributeName="y" from="-20" to="450" dur="9.5s"  begin="-3s"   repeatCount="indefinite"/></rect>
    <rect x="650" y="-20" width="6" height="10" rx="1.5" fill="#1B3A6B" opacity="0.5" transform="rotate(-10 653 -15)"><animate attributeName="y" from="-20" to="450" dur="10.5s" begin="-8s"   repeatCount="indefinite"/></rect>
    <rect x="740" y="-20" width="6" height="11" rx="1.5" fill="#2A5490" opacity="0.6" transform="rotate(20 743 -14)"><animate attributeName="y" from="-20" to="450" dur="11.5s" begin="-5s"   repeatCount="indefinite"/></rect>
    <rect x="830" y="-20" width="5" height="9"  rx="1.5" fill="#4A7BC8" opacity="0.6" transform="rotate(-16 832 -15)"><animate attributeName="y" from="-20" to="450" dur="9.8s"  begin="-1s"   repeatCount="indefinite"/></rect>
    <rect x="875" y="-20" width="5" height="9"  rx="1.5" fill="#1B3A6B" opacity="0.5" transform="rotate(26 877 -15)"><animate attributeName="y" from="-20" to="450" dur="12.5s" begin="-10s"  repeatCount="indefinite"/></rect>
    <rect x="15"  y="-20" width="5" height="9"  rx="1.5" fill="#2A5490" opacity="0.5" transform="rotate(-28 17 -15)"><animate attributeName="y" from="-20" to="450" dur="13.5s" begin="-7.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- terminal window: white card reads correctly in both GitHub light and dark themes -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" filter="url(#soft)">
    <rect x="110" y="60" width="680" height="310" rx="12" fill="#FFFFFF" stroke="#C9D2DE" stroke-width="1.5"/>
    <path d="M110 72 a12 12 0 0 1 12-12 h656 a12 12 0 0 1 12 12 v26 h-680 z" fill="#F4F6F9"/>
    <line x1="110" y1="98" x2="790" y2="98" stroke="#C9D2DE" stroke-width="1"/>
    <circle cx="134" cy="79" r="6.5" fill="#FF5F56"/>
    <circle cx="156" cy="79" r="6.5" fill="#FFBD2E"/>
    <circle cx="178" cy="79" r="6.5" fill="#27C93F"/>
    <text x="450" y="84" fill="#5A6472" font-size="13" text-anchor="middle">harsh@azure-cloud-ops: ~ — zsh</text>

    <text x="138" y="134" font-size="15"><tspan fill="#1B3A6B" font-weight="600">$</tspan><tspan fill="#111C2E"> whoami</tspan></text>
    <text x="138" y="162" fill="#5A6472" font-size="15">harsh_pardhi · Azure Cloud &amp; Automation Engineer</text>

    <text x="138" y="198" font-size="15"><tspan fill="#1B3A6B" font-weight="600">$</tspan><tspan fill="#111C2E"> stack --top</tspan></text>
    <text x="138" y="226" fill="#1B3A6B" font-size="15" font-weight="600">Azure · Terraform · Kubernetes · PowerShell · Python</text>

    <text x="138" y="262" font-size="15"><tspan fill="#1B3A6B" font-weight="600">$</tspan><tspan fill="#111C2E"> shipped --last-2y</tspan></text>
    <text x="138" y="290" fill="#5A6472" font-size="15">5,000+ users to M365 · 132 Power Apps · 10 Power BI reports</text>

    <text x="138" y="326" font-size="15"><tspan fill="#1B3A6B" font-weight="600">$</tspan><tspan fill="#111C2E"> status</tspan></text>
    <text x="138" y="352" font-size="15"><tspan fill="#1F8B3F">●</tspan><tspan fill="#111C2E"> open to Azure / DevOps roles · Gondia, IN · remote or relocate</tspan></text>
    <rect x="700" y="340" width="9" height="16" fill="#1B3A6B"><animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></rect>
  </g>
</svg>
